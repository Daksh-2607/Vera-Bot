services:
  - type: web
    name: vera-merchant-ai
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TEAM_NAME
        value: Vera Challenge Team
      - key: TEAM_MEMBERS
        value: Claude,AI-Engineer
      - key: CONTACT_EMAIL
        value: vera@magicpin.ai
      - key: BOT_VERSION
        value: 1.0.0
